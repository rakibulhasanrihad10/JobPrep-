name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Gates & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run strict static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Check for hardcoded user-facing strings
        run: dart run scripts/check_hardcoded_strings.dart

      - name: Enforce test baseline & prevent test deletion
        run: dart run scripts/verify_test_baseline.dart

      - name: Run automated tests with coverage
        run: flutter test --coverage

      - name: Enforce domain and data layer coverage gate (>= 80%)
        run: dart run scripts/check_coverage.dart

      - name: Build web application (Wasm with JS fallback)
        run: dart run scripts/build_web.dart

      - name: Set up Node.js for Lighthouse & PWA audit
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run PWA installability, mobile throttling, and Lighthouse audit
        run: node scripts/pwa_lighthouse_check.mjs

      - name: Upload Lighthouse JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: build/lighthouse-report.json
          if-no-files-found: ignore

  database:
    name: Supabase Migrations & Database Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local Supabase instance
        run: supabase start

      - name: Verify clean database reset and migrations
        run: supabase db reset

      - name: Run pgTAP database and RLS tests
        run: supabase test db

      - name: Stop Supabase instance
        if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop || true

  edge_functions:
    name: Supabase Edge Function Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check supabase/functions/send-reminders/*.ts

      - name: Run Edge Function unit and duplicate-protection tests
        run: |
          deno test --allow-env supabase/functions/send-reminders/selector_test.ts
          deno test --allow-env supabase/functions/send-reminders/notifications_selector_test.ts

  e2e_integration:
    name: End-to-End Integration Tests (Local Supabase & Headless Chrome)
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local Supabase instance
        run: |
          supabase start
          supabase db reset

      - name: Run End-to-End Integration Tests
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_e2e_test.dart -d chrome --headless || flutter test test/integration/app_e2e_test.dart

      - name: Stop Supabase instance
        if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop || true

  android:
    name: Android Build & App Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing key
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/app/upload-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; generating CI verification keystore..."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias jobprep-ci-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass "ci-keystore-password" \
              -keypass "ci-keystore-password" \
              -dname "CN=JobPrep CI, OU=Engineering, O=JobPrep, L=Dhaka, C=BD"
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/app/upload-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=ci-keystore-password" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=jobprep-ci-key" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=ci-keystore-password" >> $GITHUB_ENV
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=placeholder-anon-key

      - name: Build Android APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=placeholder-anon-key

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: jobprep-release-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jobprep-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  play_store_internal:
    name: Upload to Google Play Internal Testing Track
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download signed App Bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: jobprep-release-appbundle
          path: build/app/outputs/bundle/release

      - name: Verify Google Play credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Google Play service account credentials detected."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "PLAY_STORE_SERVICE_ACCOUNT_JSON secret not configured. Skipping upload."
          fi

      - name: Upload to Google Play (Internal Track)
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.jobprep.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed



