name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Gates & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run strict static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Check for hardcoded user-facing strings
        run: dart run scripts/check_hardcoded_strings.dart

      - name: Run automated tests
        run: flutter test

      - name: Build web application (Wasm with JS fallback)
        run: dart run scripts/build_web.dart

      - name: Set up Node.js for Lighthouse & PWA audit
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run PWA installability, mobile throttling, and Lighthouse audit
        run: node scripts/pwa_lighthouse_check.mjs

      - name: Upload Lighthouse JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: build/lighthouse-report.json
          if-no-files-found: ignore

  database:
    name: Supabase Migrations & Database Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase instance
        run: supabase start

      - name: Verify clean database reset and migrations
        run: supabase db reset

      - name: Run pgTAP database and RLS tests
        run: supabase test db

      - name: Stop Supabase instance
        if: always()
        run: supabase stop

  edge_functions:
    name: Supabase Edge Function Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check supabase/functions/send-reminders/*.ts

      - name: Run Edge Function unit and duplicate-protection tests
        run: |
          deno test --allow-env supabase/functions/send-reminders/selector_test.ts
          deno test --allow-env supabase/functions/send-reminders/notifications_selector_test.ts

  e2e_integration:
    name: End-to-End Integration Tests (Local Supabase & Headless Chrome)
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase instance
        run: |
          supabase start
          supabase db reset

      - name: Run End-to-End Integration Tests
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_e2e_test.dart -d chrome --headless || flutter test test/integration/app_e2e_test.dart

      - name: Stop Supabase instance
        if: always()
        run: supabase stop


