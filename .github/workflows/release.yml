name: Release Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag on main to release or roll back to'
        required: true
        type: string
      skip_migrations:
        description: 'Skip applying Supabase migrations (for safe web-only tag rollback)'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Verify build and release notes without migrating or deploying'
        required: true
        default: false
        type: boolean

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  verify_and_migrate:
    name: Verify Quality Gates & Apply Production Migrations
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Determine release tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout target tag with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify release tag is reachable from origin/main
        run: |
          git fetch origin main --depth=500 || git fetch origin main
          TARGET_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Release tag ${{ steps.resolve_tag.outputs.tag }} ($TARGET_SHA) is not an ancestor of origin/main."
            exit 1
          fi

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies and verify quality gates
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos --fatal-warnings
          dart run scripts/check_hardcoded_strings.dart
          flutter test

      - name: Set up Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Edge Functions
        run: |
          deno check supabase/functions/send-reminders/*.ts
          deno test --allow-env supabase/functions/send-reminders/selector_test.ts
          deno test --allow-env supabase/functions/send-reminders/notifications_selector_test.ts

      - name: Validate production deployment secrets
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          PROD_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_ANON: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          for var in CF_TOKEN CF_ACCOUNT CF_PROJECT PROD_URL PROD_ANON; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub Actions secret for production release ($var). See RELEASING.md."
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        if: ${{ (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.skip_migrations)) }}
        uses: supabase/setup-cli@v3
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply database migrations to production Supabase project
        if: ${{ (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.skip_migrations)) }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          PROD_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROD_REF" ]; then
            echo "::error::Missing production Supabase migration secrets (SUPABASE_ACCESS_TOKEN, PROD_SUPABASE_PROJECT_REF, PROD_SUPABASE_DB_PASSWORD)."
            exit 1
          fi
          supabase link --project-ref "$PROD_REF"
          supabase db push --include-all

  build_deploy_and_publish:
    name: Build, Audit, Deploy & Publish Release Notes
    needs: verify_and_migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target tag with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_and_migrate.outputs.release_tag }}
          fetch-depth: 0

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Build production web application (Wasm with JS fallback)
        run: |
          dart run scripts/build_web.dart \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=APP_VERSION="${{ needs.verify_and_migrate.outputs.release_tag }}"

      - name: Set up Node.js for Lighthouse & PWA audit
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run PWA installability and Lighthouse performance check
        run: node scripts/pwa_lighthouse_check.mjs

      - name: Generate release notes from Conventional Commits & CHANGELOG.md
        run: |
          dart run scripts/generate_release_notes.dart \
            --tag="${{ needs.verify_and_migrate.outputs.release_tag }}" \
            --changelog=CHANGELOG.md \
            --output=build/release-notes.md

      - name: Deploy production web app to Cloudflare Pages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Publish GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify_and_migrate.outputs.release_tag }}
          name: JobPrep ${{ needs.verify_and_migrate.outputs.release_tag }}
          body_path: build/release-notes.md
          draft: false
          prerelease: false
