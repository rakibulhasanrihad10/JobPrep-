name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy_staging:
    name: Build & Deploy Staging (develop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Check staging deployment secrets
        id: secrets_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          STG_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STG_ANON: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_PROJECT" ] && [ -n "$STG_URL" ] && [ -n "$STG_ANON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging Cloudflare/Supabase secrets are not configured yet; skipping remote staging deploy cleanly (see RELEASING.md)."
          fi

      - name: Set up Supabase CLI for staging migrations
        if: ${{ steps.secrets_check.outputs.ready == 'true' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.STAGING_SUPABASE_PROJECT_REF != '' && secrets.STAGING_SUPABASE_DB_PASSWORD != '' }}
        uses: supabase/setup-cli@v3
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push database migrations to staging Supabase project
        if: ${{ steps.secrets_check.outputs.ready == 'true' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.STAGING_SUPABASE_PROJECT_REF != '' && secrets.STAGING_SUPABASE_DB_PASSWORD != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}"
          supabase db push --include-all

      - name: Set up Flutter SDK
        if: steps.secrets_check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        if: steps.secrets_check.outputs.ready == 'true'
        run: flutter pub get

      - name: Build staging web application
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          dart run scripts/build_web.dart \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=SUPABASE_URL="${{ secrets.STAGING_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.STAGING_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=SENTRY_ENVIRONMENT=staging \
            --dart-define=APP_VERSION="${{ github.sha }}"

      - name: Deploy staging preview to Cloudflare Pages
        if: steps.secrets_check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=staging
