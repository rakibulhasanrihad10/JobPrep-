<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="JobPrep: Track job circulars, deadlines, encrypted portal logins, and exam preparation progress.">
  <meta name="theme-color" content="#0A0E17">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0E17">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6FA">

  <!-- iOS Safari PWA tags & opaque 180x180 Home Screen icon -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JobPrep">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon & Web App Manifest -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>JobPrep — Job Circular Tracker &amp; Exam Prep</title>

  <style>
    :root {
      --jp-bg: #0A0E17;
      --jp-card: rgba(18, 25, 42, 0.86);
      --jp-border: rgba(255, 255, 255, 0.10);
      --jp-text: #F8FAFC;
      --jp-muted: #94A3B8;
      --jp-gold: #D4AF37;
      --jp-gold-soft: rgba(212, 175, 55, 0.16);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --jp-bg: #F4F6FA;
        --jp-card: rgba(255, 255, 255, 0.90);
        --jp-border: rgba(15, 23, 42, 0.10);
        --jp-text: #0F172A;
        --jp-muted: #475569;
        --jp-gold: #B08A1A;
        --jp-gold-soft: rgba(176, 138, 26, 0.14);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--jp-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #jobprep-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(640px circle at 25% 20%, var(--jp-gold-soft), transparent 65%),
        var(--jp-bg);
      color: var(--jp-text);
      transition: opacity 220ms ease-out;
    }

    #jobprep-loader.is-ready {
      opacity: 0;
      pointer-events: none;
    }

    .jp-card {
      width: 100%;
      max-width: 320px;
      padding: 28px 24px;
      border-radius: 12px;
      background: var(--jp-card);
      border: 1px solid var(--jp-border);
      text-align: center;
      box-sizing: border-box;
    }

    .jp-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      display: block;
    }

    .jp-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .jp-subtitle {
      margin: 6px 0 18px;
      font-size: 13px;
      color: var(--jp-muted);
    }

    .jp-track {
      height: 4px;
      width: 100%;
      border-radius: 4px;
      background: var(--jp-border);
      overflow: hidden;
    }

    .jp-bar {
      height: 100%;
      width: 42%;
      border-radius: 4px;
      background: var(--jp-gold);
      animation: jp-slide 1.15s ease-in-out infinite;
    }

    @keyframes jp-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #jobprep-loader { transition: none; }
      .jp-bar { animation: none; width: 65%; }
    }
  </style>
</head>
<body>
  <div id="jobprep-loader" role="status" aria-live="polite" aria-label="Loading JobPrep">
    <div class="jp-card">
      <svg class="jp-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A0E17" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="21" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2.5"/>
        <path d="M18 25L32 30L46 25V41L32 46L18 41V25Z" stroke="#E5C158" stroke-width="3" stroke-linejoin="round"/>
        <path d="M32 30V46" stroke="#E5C158" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M32 14L36.5 18.5L32 23L27.5 18.5L32 14Z" fill="#F5DF8A"/>
      </svg>
      <h1 class="jp-title">JobPrep</h1>
      <p class="jp-subtitle" id="jobprep-loader-status">Preparing your study workspace…</p>
      <div class="jp-track"><div class="jp-bar"></div></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
